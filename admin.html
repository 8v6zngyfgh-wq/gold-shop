<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>GOLD SHOP — Admin</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#101010;--panel:#1b1b1b;--line:#303030;--muted:#999;--white:#f6f6f3;--gold:#d5bd83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:13px;letter-spacing:.22em;font-weight:800}.tag{font-size:10px;color:var(--gold);letter-spacing:.16em;border:1px solid #5a4c30;padding:7px 9px}h1{font-size:clamp(30px,7vw,46px);letter-spacing:-.06em;line-height:.98;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.stat,.product,.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat strong{font-size:22px}.toolbar{display:flex;gap:9px;margin-bottom:14px}.search{flex:1;min-width:0}.field,textarea{width:100%;background:#111;border:1px solid #383838;border-radius:9px;color:#fff;padding:12px;font:inherit;font-size:14px;outline:none}.field:focus,textarea:focus{border-color:var(--gold)}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:9px;padding:12px 15px;background:var(--gold);color:#17130b;font-weight:750}.btn.secondary{background:#303030;color:#fff}.btn:disabled{opacity:.55}.product{display:flex;gap:13px;padding:13px;margin:10px 0;align-items:center}.thumb{width:64px;height:76px;flex:0 0 64px;border-radius:8px;background:#292929;object-fit:cover}.pinfo{min-width:0;flex:1}.pname{font-weight:700;font-size:14px;line-height:1.3}.meta{color:var(--muted);font-size:12px;margin-top:6px}.price{font-size:14px;font-weight:700;margin-top:7px}.editor{padding:17px;margin-top:18px;display:none}.editor.open{display:block}.editor h2{font-size:19px;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.group{margin:0 0 12px}.group label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}.wide{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0 14px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.variant-card{border:1px solid #383838;border-radius:10px;padding:12px;margin:10px 0;background:#141414}.variant-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.variant-head input{flex:1;min-width:0}.size-row{display:grid;grid-template-columns:1fr 105px auto;gap:8px;margin:7px 0}.size-row input{min-width:0}.mini-btn{border:1px solid #484848;background:#242424;color:#eee;border-radius:8px;padding:9px 11px}.variant-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.variant-empty{color:var(--muted);font-size:12px;padding:12px;border:1px dashed #444;border-radius:9px}@media(max-width:440px){.size-row{grid-template-columns:1fr 82px auto}.mini-btn{padding:9px 8px}}.notice{font-size:13px;color:var(--gold);min-height:20px;margin:10px 0}.empty{text-align:center;padding:32px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:440px){.thumb{width:54px;height:68px;flex-basis:54px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.btn{padding:11px 12px}}
</style></head><body><main><div class="top"><div class="brand">GOLD SHOP</div><div class="tag">ADMIN CONTROL</div></div><h1>Управление<br>магазином.</h1><p class="sub">Изменения сохраняются в общей базе и автоматически отображаются на сайте.</p><section class="stats"><div class="stat"><small>Всего товаров</small><strong id="total">—</strong></div><div class="stat"><small>Активных товаров</small><strong id="active">—</strong></div></section><div class="toolbar"><input class="field search" id="search" placeholder="Найти товар…"><button class="btn secondary" id="reload">Обновить</button></div><div id="products"><div class="empty">Загружаем…</div></div><section class="editor" id="editor"><h2 id="editTitle">Редактирование товара</h2><div class="grid"><div class="group wide"><label for="name">Название</label><input class="field" id="name" maxlength="120"></div><div class="group"><label for="price">Цена, ₽</label><input class="field" id="price" type="number" min="0" step="1"></div><div class="group"><label for="oldPrice">Старая цена, ₽</label><input class="field" id="oldPrice" type="number" min="0" step="1" placeholder="Необязательно"></div><div class="group wide"><label for="description">Описание</label><textarea id="description" rows="3"></textarea></div><div class="group wide"><label for="images">Фотографии — HTTPS-ссылки, каждая с новой строки</label><textarea id="images" rows="3"></textarea></div><div class="group wide"><label>Цвета, размеры и остатки</label><div id="variantEditor"></div><button type="button" class="btn secondary" id="addColor" style="margin-top:10px">+ Добавить цвет</button><p class="hint">Укажи цвет, размеры и количество на складе. Нулевой остаток означает, что размер закончился.</p></div><div class="group wide"><label><input type="checkbox" id="isActive" style="accent-color:#d5bd83;margin-right:8px">Товар виден в каталоге</label></div></div><div class="notice" id="notice"></div><div class="actions"><button class="btn" id="save">Сохранить изменения</button><button class="btn secondary" id="cancel">Отмена</button></div></section></main>
<script>
(()=>{const tg=window.Telegram&&window.Telegram.WebApp,API="https://gold-shop-api-gv5e.onrender.com";let products=[],selected=null;const $=id=>document.getElementById(id);if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#101010");tg.setBackgroundColor("#101010")}catch(e){}}const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const headers=()=>({"Content-Type":"application/json","X-Telegram-Init-Data":tg?tg.initData:""});const money=v=>new Intl.NumberFormat("ru-RU").format(Number(v)||0)+" ₽";const stock=p=>(p.variants||[]).reduce((n,v)=>n+Object.values(v.sizes||{}).reduce((a,q)=>a+Math.max(0,Number(q)||0),0),0);async function req(url,opt){const r=await fetch(API+url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка запроса");return d}
function render(){const q=$("search").value.trim().toLowerCase(),list=products.filter(p=>String(p.name).toLowerCase().includes(q));$("total").textContent=products.length;$("active").textContent=products.filter(p=>p.is_active).length;$("products").innerHTML=list.length?list.map(p=>'<article class="product"><img class="thumb" src="'+esc((p.images||[])[0]||"")+'"><div class="pinfo"><div class="pname">'+esc(p.name)+'</div><div class="meta">Остаток: '+stock(p)+' шт. · '+(p.is_active?"В каталоге":"Скрыт")+'</div><div class="price">'+money(p.price)+'</div></div><button class="btn secondary" data-edit="'+esc(p.id)+'">Изменить</button></article>').join(""):'<div class="empty">Ничего не найдено.</div>';$("products").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>edit(b.dataset.edit)))}
function renderVariantEditor(){const box=$("variantEditor"),variants=selected?.variants||[];if(!variants.length){box.innerHTML='<div class="variant-empty">Пока нет цветов. Добавь первый цвет.</div>';return}box.innerHTML=variants.map((v,i)=>'<div class="variant-card" data-variant="'+i+'"><div class="variant-head"><input class="field" data-color placeholder="Название цвета" value="'+esc(v.color||'')+'"><button type="button" class="mini-btn" data-remove-color>Удалить цвет</button></div>'+Object.entries(v.sizes||{}).map(([size,qty])=>'<div class="size-row"><input class="field" data-size value="'+esc(size)+'" placeholder="Размер"><input class="field" data-stock type="number" min="0" step="1" value="'+esc(qty)+'" placeholder="Кол-во"><button type="button" class="mini-btn" data-remove-size>×</button></div>').join('')+'<div class="variant-actions"><button type="button" class="mini-btn" data-add-size>+ Размер</button></div></div>').join('')}function collectVariants(){const cards=[...$("variantEditor").querySelectorAll("[data-variant]")],result=[];for(const card of cards){const color=card.querySelector("[data-color]").value.trim();if(!color)throw Error("Укажи название каждого цвета.");const sizes={};for(const row of card.querySelectorAll(".size-row")){const size=row.querySelector("[data-size]").value.trim(),qty=Number(row.querySelector("[data-stock]").value);if(!size||!Number.isInteger(qty)||qty<0)throw Error("Проверь размер и остаток: количество должно быть целым числом от 0.");if(Object.prototype.hasOwnProperty.call(sizes,size))throw Error("Размер "+size+" повторяется у цвета "+color+".");sizes[size]=qty}if(!Object.keys(sizes).length)throw Error("Добавь хотя бы один размер для цвета "+color+".");const original=(selected.variants||[]).find(v=>v.color===color);result.push({...original,color,sizes})}return result}function edit(id){selected=products.find(p=>p.id===id);if(!selected)return;$("editTitle").textContent=selected.name;$("name").value=selected.name||"";$("price").value=selected.price??"";$("oldPrice").value=selected.old_price??"";$("description").value=selected.description||"";$("images").value=(selected.images||[]).join("\n");$("isActive").checked=!!selected.is_active;renderVariantEditor();$("notice").textContent="";$("editor").classList.add("open");$("editor").scrollIntoView({behavior:"smooth",block:"start"})}
async function load(){$("products").innerHTML='<div class="empty">Загружаем каталог…</div>';try{const d=await req("/api/admin/products",{headers:headers()});products=d.products||[];render()}catch(e){$("products").innerHTML='<div class="empty">'+esc(!tg||!tg.initData?"Открой админ-панель через /admin в GOLD SHOP боте.":e.message)+'</div>'}}
$("variantEditor").addEventListener("click",e=>{const card=e.target.closest("[data-variant]");if(!card)return;if(e.target.closest("[data-remove-color]")){card.remove();if(!$("variantEditor").querySelector("[data-variant]"))$("variantEditor").innerHTML='<div class="variant-empty">Пока нет цветов. Добавь первый цвет.</div>';return}if(e.target.closest("[data-add-size]")){const row=document.createElement("div");row.className="size-row";row.innerHTML='<input class="field" data-size placeholder="Размер"><input class="field" data-stock type="number" min="0" step="1" value="0" placeholder="Кол-во"><button type="button" class="mini-btn" data-remove-size>×</button>';card.insertBefore(row,card.querySelector(".variant-actions"));return}if(e.target.closest("[data-remove-size]"))e.target.closest(".size-row").remove()});$("addColor").addEventListener("click",()=>{if(!selected)return;const empty=$("variantEditor").querySelector(".variant-empty");if(empty)empty.remove();const card=document.createElement("div");card.className="variant-card";card.dataset.variant=$("variantEditor").querySelectorAll("[data-variant]").length;card.innerHTML='<div class="variant-head"><input class="field" data-color placeholder="Название цвета"><button type="button" class="mini-btn" data-remove-color>Удалить цвет</button></div><div class="size-row"><input class="field" data-size placeholder="Размер"><input class="field" data-stock type="number" min="0" step="1" value="0" placeholder="Кол-во"><button type="button" class="mini-btn" data-remove-size>×</button></div><div class="variant-actions"><button type="button" class="mini-btn" data-add-size>+ Размер</button></div>';$("variantEditor").appendChild(card);card.querySelector("[data-color]").focus()});$("search").addEventListener("input",render);$("reload").addEventListener("click",load);$("cancel").addEventListener("click",()=>{$("editor").classList.remove("open");selected=null});$("save").addEventListener("click",async()=>{if(!selected)return;let variants;try{variants=collectVariants()}catch(e){$("notice").textContent=e.message||"Проверь цвета, размеры и остатки.";return}const price=Number($("price").value),old=$("oldPrice").value.trim();if(!Number.isFinite(price)||price<0||old&&(!Number.isFinite(Number(old))||Number(old)<0)){$("notice").textContent="Проверь цену.";return}const payload={name:$("name").value.trim(),price,old_price:old?Number(old):null,description:$("description").value.trim(),images:$("images").value.split("\n").map(x=>x.trim()).filter(Boolean),variants,is_active:$("isActive").checked};$("save").disabled=true;$("notice").textContent="Сохраняем…";try{const d=await req("/api/admin/products/"+encodeURIComponent(selected.id),{method:"PATCH",headers:headers(),body:JSON.stringify(payload)});products=products.map(p=>p.id===d.product.id?d.product:p);render();$("notice").textContent="Сохранено. Изменения уже записаны в общую базу.";if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred("success")}catch(e){$("notice").textContent=e.message}finally{$("save").disabled=false}});load()})();
</script></body></html>
